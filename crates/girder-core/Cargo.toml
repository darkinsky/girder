[package]
name = "girder-core"
description = "Service registry, effects, and lifecycle primitives for the Girder agent harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-stream = "0.3.6"
futures = { version = "0.3", features = ["std"] }
libc = "0.2.191"
nix = { version = "0.31.3", features = ["signal", "process"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
thiserror = "2"
tokio = { workspace = true }
tokio-util = { workspace = true }
zstd = "0.14.3"

[dev-dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }
tokio = { workspace = true }

[lints]
workspace = true
