[package]
name = "girder-rpc"
description = "RPC protocol and WebSocket server for the Girder harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures = "0.3"
girder-core = { workspace = true }
hmac = "0.12"
httpdate = "1"
rand = "0.9"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = "0.1"
url = "2"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
tokio-tungstenite = "0.28"

[lints]
workspace = true
