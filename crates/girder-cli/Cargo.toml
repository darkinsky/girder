[package]
name = "girder-cli"
description = "Command-line entry point for the Girder agent harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "girder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
girder-core = { workspace = true }
girder-rpc = { path = "../girder-rpc" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal"] }

[lints]
workspace = true
