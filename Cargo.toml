[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/darkinsky/girder"

[workspace.dependencies]
girder-core = { path = "crates/girder-core" }
girder-macros = { path = "crates/girder-macros" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }

[workspace.lints.rust]
# `deny` rather than `forbid`: process-group control needs one `pre_exec` call, and `forbid`
# cannot be lifted locally. Every exemption must carry a `reason`.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
